# Version catalog — single source of truth for the whole build.
# Versions started as those of the original pom.xml (awslabs eed1506), so that the Gradle
# port stayed behaviour-identical to the Maven build. They move from there when there is a
# reason to move them — a security fix, most often — and `git diff eed1506` still shows
# every such deviation.
[versions]
awsSdkV2 = "2.53.1"
mskIamAuth = "2.3.7"
kafka = "3.9.2"
kafkaScala = "2.12"
avro = "1.11.4"
flink = "1.12.2"
protobuf = "3.25.5"
apicurio = "2.1.3.Final"
wire = "5.2.0"
kotlinRuntime = "2.4.10"       # Kotlin deps pulled in by mbknor/wire, distinct from the compiler version
mbknorJsonSchema = "1.0.39"
everitJsonSchema = "1.14.6"
classgraph = "4.8.192"
commonsLang3 = "3.20.0"
commonsCollections4 = "4.6.0"
commonsCli = "1.11.0"
guava = "33.6.0-jre"
jackson = "2.22.2"
lz4 = "1.11.2"
slf4j = "1.7.30"
log4j = "2.26.1"
lombok = "1.18.46"
junitJupiter = "5.14.4"
junit4 = "4.13.2"
mockito = "5.23.0"
mockitoKotlin = "6.3.0"
hamcrest = "3.0"
awaitility = "4.3.0"
kinesisClient = "2.2.9"
kinesisProducer = "1.0.7"
localstackUtils = "0.2.23"
okio = "3.18.1"
okioFakeFs = "3.18.1"
kotlinxSerialization = "1.11.0"
protoGoogleCommon = "2.7.4"
truth = "1.1.3"
powermockReflect = "2.0.9"
podam = "8.0.2.RELEASE"
jaxbApi = "2.3.1"

# Plugins
kotlin = "2.4.10"
shadow = "9.6.1"
protobufPlugin = "0.10.0"
avroPlugin = "1.9.1"
licenseReport = "2.9"

[libraries]
# --- AWS ---
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdkV2" }
aws-glue = { module = "software.amazon.awssdk:glue" }
aws-sts = { module = "software.amazon.awssdk:sts" }
aws-arns = { module = "software.amazon.awssdk:arns" }
aws-auth = { module = "software.amazon.awssdk:auth" }
aws-kinesis = { module = "software.amazon.awssdk:kinesis" }
aws-jsonProtocol = { module = "software.amazon.awssdk:aws-json-protocol" }
aws-urlConnectionClient = { module = "software.amazon.awssdk:url-connection-client" }
aws-mskIamAuth = { module = "software.amazon.msk:aws-msk-iam-auth", version.ref = "mskIamAuth" }
kinesis-client = { module = "software.amazon.kinesis:amazon-kinesis-client", version.ref = "kinesisClient" }
kinesis-producer = { module = "software.amazon.kinesis:amazon-kinesis-producer", version.ref = "kinesisProducer" }

# --- Kafka ---
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
kafka-streams = { module = "org.apache.kafka:kafka-streams", version.ref = "kafka" }
kafka-connectApi = { module = "org.apache.kafka:connect-api", version.ref = "kafka" }
kafka-connectJson = { module = "org.apache.kafka:connect-json", version.ref = "kafka" }

# --- Serialization ---
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
avro-compiler = { module = "org.apache.avro:avro-compiler", version.ref = "avro" }
avro-ipc = { module = "org.apache.avro:avro-ipc", version.ref = "avro" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-javaUtil = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
protoGoogleCommon = { module = "com.google.api.grpc:proto-google-common-protos", version.ref = "protoGoogleCommon" }
apicurio-protobufUtils = { module = "io.apicurio:apicurio-registry-protobuf-schema-utilities", version.ref = "apicurio" }
wire-schema = { module = "com.squareup.wire:wire-schema", version.ref = "wire" }
wire-compiler = { module = "com.squareup.wire:wire-compiler", version.ref = "wire" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-cbor = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-cbor" }
mbknor-jsonSchema = { module = "com.kjetland:mbknor-jackson-jsonschema_2.12", version.ref = "mbknorJsonSchema" }
everit-jsonSchema = { module = "com.github.erosb:everit-json-schema", version.ref = "everitJsonSchema" }
kotlinx-serializationCore = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm", version.ref = "kotlinxSerialization" }

# --- Kotlin runtime pulled in by third-party libraries ---
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinRuntime" }
kotlin-stdlibJdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlinRuntime" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlinRuntime" }
kotlin-scriptingCompilerImplEmbeddable = { module = "org.jetbrains.kotlin:kotlin-scripting-compiler-impl-embeddable", version.ref = "kotlinRuntime" }
kotlin-scriptingCompilerEmbeddable = { module = "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable", version.ref = "kotlinRuntime" }

# --- Flink ---
flink-avro = { module = "org.apache.flink:flink-avro", version.ref = "flink" }
flink-streamingJava = { module = "org.apache.flink:flink-streaming-java_2.11", version.ref = "flink" }

# --- Utilities ---
classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }
commons-collections4 = { module = "org.apache.commons:commons-collections4", version.ref = "commonsCollections4" }
commons-cli = { module = "commons-cli:commons-cli", version.ref = "commonsCli" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
lz4 = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakeFileSystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okioFakeFs" }
jaxb-api = { module = "javax.xml.bind:jaxb-api", version.ref = "jaxbApi" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
shadow-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-lombokPlugin = { module = "org.jetbrains.kotlin.plugin.lombok:org.jetbrains.kotlin.plugin.lombok.gradle.plugin", version.ref = "kotlin" }
licenseReport-plugin = { module = "com.github.jk1:gradle-license-report", version.ref = "licenseReport" }

# --- Logging ---
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4jImpl = { module = "org.apache.logging.log4j:log4j-slf4j-impl", version.ref = "log4j" }
log4j-compatApi = { module = "org.apache.logging.log4j:log4j-1.2-api", version.ref = "log4j" }

# --- Test ---
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitJupiter" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
junit-jupiterApi = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiterEngine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitJupiter" }
junit-jupiterParams = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junitJupiter" }
junit-platformCommons = { module = "org.junit.platform:junit-platform-commons" }
junit-vintageEngine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitJupiter" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junitJupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
localstack-utils = { module = "cloud.localstack:localstack-utils", version.ref = "localstackUtils" }
truth-protoExtension = { module = "com.google.truth.extensions:truth-proto-extension", version.ref = "truth" }
powermock-reflect = { module = "org.powermock:powermock-reflect", version.ref = "powermockReflect" }
podam = { module = "uk.co.jemos.podam:podam", version.ref = "podam" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
avro = { id = "com.github.davidmc24.gradle.plugin.avro", version.ref = "avroPlugin" }
