# The service set of .github/workflows/integration.yml, so that a local run and the nightly
# run face the same stack. Ports and images are kept in step with that workflow.
services:
  kafka:
    image: "apache/kafka:3.9.1"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # The tests run on the host and reach the broker through the published port,
      # so the broker has to advertise that address.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  localstack:
    image: "localstack/localstack:3.8"
    # GlueSchemaRegistryKinesisIntegrationTest hard-codes 4566, as the upstream source did.
    ports:
      - "4566:4566"
    environment:
      # sts: the Kinesis producer's native child process calls GetCallerIdentity to
      # resolve the stream ARN, and dies if it cannot.
      SERVICES: kinesis,dynamodb,cloudwatch,sts
      EAGER_SERVICE_LOADING: 1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  # LocalStack does not serve Glue outside its top paid tier, and the Schema Registry it
  # offers there is AVRO-only; moto implements the registry calls for all three data formats.
  moto:
    image: "motoserver/moto:5.2.2"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/moto-api/"]
      interval: 10s
      timeout: 5s
      retries: 20
