policy:
  # Workflows que mobsuccessbot ne doit pas proposer sur ce repo.
  # Les noms sont ceux des actions déclarées dans github-mobsuccess-policy
  # (app/policies/gh-actions.js), pas les noms de fichiers.
  skip-actions:
    - linear
    - ms-testers
    - mobsuccess
    - closed
    - python
  repo-settings:
    - branch: master
      # Repo piloté par des agents : pas de reviewer humain requis, et les admins
      # (team Core) peuvent forcer un merge. Même réglage que panoramai.
      override-settings:
        requiredApprovingReviewCount: 0
        isAdminEnforced: false
      # La détection automatique ne connaît que les jobs des workflows modèles de la
      # policy ; ceux de ci.yml, écrit à la main, lui sont invisibles. Sans cette
      # liste, une CI rouge laisserait la PR mergeable.
      additional-required-job-names:
        - Gradle Build
linear:
  team_identifier: FTTECH
  team_label_identifier: Core
  title_macro: "% in aws-glue-schema-registry"
  cli_defaults:
    feature_team: FTTECH
    team_label: Core
    type_label: Improvement 🛠️
