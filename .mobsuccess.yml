policy:
  # Workflows mobsuccessbot must not propose on this repository.
  # The names are those of the actions declared in github-mobsuccess-policy
  # (app/policies/gh-actions.js), not the workflow file names.
  skip-actions:
    - linear
    - ms-testers
    - mobsuccess
    - closed
    - python
  repo-settings:
    - branch: master
      # Agent-driven repository: no human reviewer required, and admins (team Core)
      # can force a merge. Same settings as panoramai.
      override-settings:
        requiredApprovingReviewCount: 0
        isAdminEnforced: false
      # Automatic detection only knows the jobs of the policy's template workflows;
      # those of ci.yml, written by hand, are invisible to it. Without this list, a
      # red CI would still leave the pull request mergeable.
      #
      # The two matrix jobs carry the guarantee that #80 was written for: the JSON
      # Schema output must not depend on the JDK that produced it. `Gradle Build`
      # runs on 17 only, so without them a regression that only shows on 21 or 25
      # merges green. Their names are the resolved ones, `Tests on JDK ${{ matrix.jdk }}`
      # expanded, since that is what a required check matches on.
      #
      # `Analyze java-kotlin` is required only because the ENABLE_CODEQL repository
      # variable is now set. The job is gated on it, and a required check that skips
      # counts as green — so listing it while the variable is unset would look like a
      # security gate without being one. Unset the variable and this entry goes with it.
      additional-required-job-names:
        - Gradle Build
        - Tests on JDK 21
        - Tests on JDK 25
        - Analyze java-kotlin
linear:
  team_identifier: FTTECH
  team_label_identifier: Core
  title_macro: "% in aws-glue-schema-registry"
  cli_defaults:
    feature_team: FTTECH
    team_label: Core
    type_label: Improvement 🛠️
