policy:
  # Workflows mobsuccessbot must not propose on this repository.
  # The names are those of the actions declared in github-mobsuccess-policy
  # (app/policies/gh-actions.js), not the workflow file names.
  skip-actions:
    - linear
    - ms-testers
    - mobsuccess
    - closed
    - python
  repo-settings:
    - branch: master
      # Agent-driven repository: no human reviewer required, and admins (team Core)
      # can force a merge. Same settings as panoramai.
      override-settings:
        requiredApprovingReviewCount: 0
        isAdminEnforced: false
      # Automatic detection only knows the jobs of the policy's template workflows;
      # those of ci.yml, written by hand, are invisible to it. Without this list, a
      # red CI would still leave the pull request mergeable.
      additional-required-job-names:
        - Gradle Build
linear:
  team_identifier: FTTECH
  team_label_identifier: Core
  title_macro: "% in aws-glue-schema-registry"
  cli_defaults:
    feature_team: FTTECH
    team_label: Core
    type_label: Improvement 🛠️
