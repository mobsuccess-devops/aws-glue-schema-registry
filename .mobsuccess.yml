policy:
  skip-actions:
    - linear
    - ms-testers
    - mobsuccess
    - closed
    - python
  repo-settings:
    - branch: master
      override-settings:
        requiredApprovingReviewCount: 0
        isAdminEnforced: true
      additional-required-job-names:
        - Gradle Build
        - Tests on JDK 21
        - Tests on JDK 25
        - Tests on the protobuf floor
        - Analyze java-kotlin
        - ktlint
linear:
  team_identifier: FTTECH
  team_label_identifier: Core
  title_macro: "% in aws-glue-schema-registry"
  cli_defaults:
    feature_team: FTTECH
    team_label: Core
    type_label: Improvement 🛠️
