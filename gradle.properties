# Run independent module tasks concurrently. The graph is linear at the root
# (common -> serde -> everything else) but the seven leaves are siblings.
org.gradle.parallel=true

# Reuse task outputs across builds and across branches. The reproducible archive
# settings in gsr.java-conventions are what make that sound for the jar tasks.
org.gradle.caching=true

# Configuration caching stays off: com.github.jk1.dependency-license-report holds a
# Project reference in its ReportTask, which Gradle cannot serialize, so the entry is
# discarded on every build of the four shaded modules. Checked against 2.9 and against
# the current 3.1.4 — both fail the same way. Flip this on once that task is fixed;
# nothing else in the build objects.
# org.gradle.configuration-cache=true

# The daemon defaults to 512m and the Kotlin compiler daemon inherits it, which is
# not enough to compile the test sources of serializer-deserializer.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
