repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0-alpha.4
    hooks:
      - id: prettier
        # The real scope is set in .prettierignore; this filter keeps pre-commit
        # from handing the test fixtures to the formatter anyway.
        exclude: ^(gradlew|gradlew\.bat|gradle/wrapper/|.*/src/)
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.14.0
    hooks:
      - id: pretty-format-kotlin
        args: [--autofix, --ktlint-version=1.4.1]
