name: Bug report
description: Something in the library does not behave as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here — follow [SECURITY.md](https://github.com/mobsuccess-devops/aws-glue-schema-registry/blob/master/SECURITY.md).
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you observed, and what you expected instead. A stack trace helps.
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: Artifact and version
      description: For example `com.mobsuccess:schema-registry-serde:2.3.1`.
    validations:
      required: true
  - type: input
    id: jvm
    attributes:
      label: JVM
      description: The output of `java -version`.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Data format
      options:
        - AVRO
        - JSON Schema
        - Protobuf
        - Not format-specific
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Does it also happen with the original AWS artifact?
      description: >-
        `software.amazon.glue:schema-registry-serde`. This decides how the bug is handled:
        a conversion regression is ours to fix, an inherited bug is a deviation to document.
      options:
        - "No: the AWS artifact behaves correctly"
        - "Yes: the AWS artifact does the same"
        - Not checked
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: >-
        A failing test is worth more than a description — the suite is the project's only
        guard rail, and a reproducer usually belongs in it.
