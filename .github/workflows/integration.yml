name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    # Nightly, off the pull request path: these tests take minutes and need a
    # broker and an emulator the unit run does not.
    - cron: "0 3 * * *"

# One run at a time: the tests create and delete schemas under fixed name
# prefixes, so two concurrent runs would clean up after each other.
concurrency:
  group: integration-tests
  cancel-in-progress: false

jobs:
  without-glue:
    name: Without a Glue account
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      AWS_REGION: us-east-2
      # LocalStack accepts any credentials, and nothing in this job leaves the runner.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          # The tests run on the runner host and reach the broker through the
          # published port, so the broker has to advertise that address.
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      localstack:
        image: localstack/localstack:3.8
        ports:
          - 4566:4566
        env:
          SERVICES: kinesis,dynamodb,cloudwatch
          EAGER_SERVICE_LOADING: 1
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - name: Wait for Kafka
        run: .github/scripts/wait-for-kafka.sh "${{ job.services.kafka.id }}"
      # The converter test needs nothing at all; the two others exercise a Kafka
      # round trip and a Kinesis one against LocalStack, without touching Glue.
      - name: Run
        run: |
          ./gradlew --no-daemon \
            :schema-registry-kafkaconnect-converter:integrationTest \
            :schema-registry-integration-tests:integrationTestWithoutGlue
      - name: Test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            **/build/test-results/integrationTest/*.xml
            **/build/test-results/integrationTestWithoutGlue/*.xml
          comment_mode: "off"
          check_name: "Integration Tests (without a Glue account)"

  with-glue:
    name: Against Glue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      # moto below answers the Glue Schema Registry calls, so this job needs no AWS
      # account. Setting the GLUE_ENDPOINT repository variable points the same tests
      # at a real endpoint instead — the public one, or a VPC endpoint.
      GLUE_ENDPOINT: ${{ vars.GLUE_ENDPOINT || 'http://localhost:5000' }}
      # The tests resolve their region through the AWS SDK provider chain, which
      # reads this; there is no override of our own to add.
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      # An emulator accepts any credentials; a real endpoint needs the secrets.
      AWS_ACCESS_KEY_ID: ${{ secrets.GLUE_IT_AWS_ACCESS_KEY_ID || 'test' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.GLUE_IT_AWS_SECRET_ACCESS_KEY || 'test' }}
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      localstack:
        image: localstack/localstack:3.8
        ports:
          - 4566:4566
        env:
          SERVICES: kinesis,dynamodb,cloudwatch
          EAGER_SERVICE_LOADING: 1
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      # LocalStack does not serve Glue outside its top paid tier, and the Schema
      # Registry it offers there is AVRO-only; moto implements the registry calls
      # for all three data formats.
      moto:
        image: motoserver/moto:5.2.2
        ports:
          - 5000:5000
        options: >-
          --health-cmd "curl -sf http://localhost:5000/moto-api/"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - name: Wait for Kafka
        run: .github/scripts/wait-for-kafka.sh "${{ job.services.kafka.id }}"
      - name: Run
        run: ./gradlew --no-daemon :schema-registry-integration-tests:integrationTest
      - name: Test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "**/build/test-results/integrationTest/*.xml"
          comment_mode: "off"
          check_name: "Integration Tests (against Glue)"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: "**/build/reports/tests/integrationTest/"
          retention-days: 14
