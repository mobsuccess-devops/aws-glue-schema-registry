name: JVM Library

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
      - prod

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21 fait tourner Gradle, 17 sert de toolchain de compilation : la lib
          # cible 17 pour rester consommable par Kafka Connect et Flink.
          java-version: |
            17
            21
          cache: gradle
      - name: Build, test & coverage
        run: ./gradlew assemble check jacocoTestReport --no-daemon
      - name: Test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "**/build/test-results/test/*.xml"
          comment_title: "Test Results"
          check_name: "Test Results"
      - name: Coverage report
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Coverage Report"
          update-comment: true
          min-coverage-overall: 60
          min-coverage-changed-files: 60
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: "**/build/reports/jacoco/test/html/"
          retention-days: 14

  lint:
    name: ktlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: ktlint
        uses: ScaCap/action-ktlint@v1
        with:
          ktlint_version: 1.4.1
          github_token: ${{ secrets.github_token }}
          filter_mode: file
          reporter: github-pr-check
          level: warning

  publish-snapshot:
    name: Publish SNAPSHOT
    needs: [build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - name: Calculate version
        id: version
        run: |
          eval "$(./scripts/version.sh)"
          echo "version=${VERSION}-SNAPSHOT" >> $GITHUB_OUTPUT
          echo "Publishing ${VERSION}-SNAPSHOT"
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew publish --no-daemon

  publish-release:
    name: Publish Release
    needs: [build]
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - name: Calculate version
        id: version
        run: |
          eval "$(./scripts/version.sh)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION"
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew publish --no-daemon
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
