version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 100
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The Kotlin dependencies pulled in by mbknor-jackson-jsonschema and wire are
      # pinned together (kotlinRuntime in the catalog): bumping them separately
      # breaks resolution.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
      aws:
        patterns:
          - "software.amazon.awssdk:*"
      junit:
        patterns:
          - "org.junit*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 100
    commit-message:
      prefix: chore
      include: scope
