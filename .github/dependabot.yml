version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 100
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "org.apache.flink:*"
        update-types:
          - version-update:semver-major
      - dependency-name: "org.apache.kafka:*"
        update-types:
          - version-update:semver-major
      - dependency-name: "org.apache.avro:*"
        versions:
          - ">= 1.12.2"
      - dependency-name: "com.google.protobuf:protoc"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
      aws:
        patterns:
          - "software.amazon.awssdk:*"
          - "software.amazon.msk:*"
          - "software.amazon.kinesis:*"
      kafka:
        patterns:
          - "org.apache.kafka:*"
      avro:
        patterns:
          - "org.apache.avro:*"
      protobuf:
        patterns:
          - "com.google.protobuf:*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
      logging:
        patterns:
          - "org.slf4j:*"
          - "org.apache.logging.log4j:*"
      junit:
        patterns:
          - "org.junit*"
      mockito:
        patterns:
          - "org.mockito*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 100
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
